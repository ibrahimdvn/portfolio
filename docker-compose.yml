services:
  postgres:
    image: postgres:17-alpine
    container_name: icd-site-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-ibrahim_can_duven_site}
      POSTGRES_USER: ${PGUSER:-portfolio_app}
      POSTGRES_PASSWORD: ${PGPASSWORD:?PGPASSWORD must be set in .env}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - portfolio-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  portfolio-postgres-data:
